TripId:
  name: tripId
  in: path
  required: true
  description: 旅行識別；不存在或非本人旅行均回應 404。
  schema:
    type: string
    format: uuid
ExpenseId:
  name: expenseId
  in: path
  required: true
  description: 支出識別；必須屬於路徑指定的本人旅行。
  schema:
    type: string
    format: uuid
MemberId:
  name: memberId
  in: path
  required: true
  description: 指定旅行中的穩定成員識別；他人旅行或不屬此旅行均回 404。
  schema:
    type: string
    format: uuid
SettlementId:
  name: settlementId
  in: path
  required: true
  description: 已結清安排識別；結果未明時可用於查證。
  schema:
    type: string
    format: uuid
RepaymentId:
  name: repaymentId
  in: path
  required: true
  description: 獨立還款或結清實付的識別；結果未明時可用於查證。
  schema:
    type: string
    format: uuid
CategoryId:
  name: categoryId
  in: path
  required: true
  description: 個人分類識別；不存在或非本人分類均回應 404。
  schema:
    type: string
    format: uuid
PageLimit:
  name: limit
  in: query
  required: false
  description: 每頁預設 50，最高 100。HTTP query 為字串，先完整比對十進位正整數後再解析；空字串、浮點、50abc 拒絕，不使用寬鬆轉型。
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 50
PageCursor:
  name: cursor
  in: query
  required: false
  description: 前次回應的 nextCursor；不透明，綁定帳號、查詢範圍及排序。不可自行推算，也不可沿用另一帳號的 cursor。
  schema:
    type: string
    minLength: 1
