TripId:
  name: tripId
  in: path
  required: true
  description: 旅行識別；不存在或非本人旅行均回應 404。
  schema:
    type: string
    format: uuid
OperationId:
  name: operationId
  in: path
  required: true
  description: 客戶端為一次旅行生命週期或縮圖命令產生的 UUID；僅本人可查收據。
  schema:
    type: string
    format: uuid
ThumbnailRevision:
  name: thumbnailRevision
  in: path
  required: true
  description: 從旅行清單或狀態取得的縮圖版本十進位字串；僅目前版本可讀。
  schema:
    type: string
    pattern: '^(?:0|[1-9][0-9]*)$'
UploadOperationId:
  name: X-Operation-Id
  in: header
  required: true
  description: 單檔上傳的持久命令 UUID；重試必須保留相同檔案 bytes 與所有預期版本。
  schema:
    type: string
    format: uuid
ExpectedLifecycleRevision:
  name: X-Expected-Lifecycle-Revision
  in: header
  required: true
  description: 上傳或無本文縮圖命令的預期生命週期版本；完整十進位字串，不經 JS Number。
  schema:
    type: string
    pattern: '^(?:0|[1-9][0-9]*)$'
ExpectedThumbnailRevision:
  name: X-Expected-Thumbnail-Revision
  in: header
  required: true
  description: 縮圖命令的預期縮圖版本；完整十進位字串，不經 JS Number。
  schema:
    type: string
    pattern: '^(?:0|[1-9][0-9]*)$'
ExpenseId:
  name: expenseId
  in: path
  required: true
  description: 支出識別；必須屬於路徑指定的本人旅行。
  schema:
    type: string
    format: uuid
MemberId:
  name: memberId
  in: path
  required: true
  description: 指定旅行中的穩定成員識別；他人旅行或不屬此旅行均回 404。
  schema:
    type: string
    format: uuid
SettlementId:
  name: settlementId
  in: path
  required: true
  description: 已結清安排識別；結果未明時可用於查證。
  schema:
    type: string
    format: uuid
SettlementExplanationInclude:
  name: include
  in: query
  required: false
  description: 僅指定 explanationDetails 時，回傳可供前端組成各語言說明的同快照結構化資料；省略時維持原 SettlementView 回應形狀。
  schema:
    type: string
    enum: [explanationDetails]
RepaymentId:
  name: repaymentId
  in: path
  required: true
  description: 獨立還款或結清實付的識別；結果未明時可用於查證。
  schema:
    type: string
    format: uuid
CategoryId:
  name: categoryId
  in: path
  required: true
  description: 個人分類識別；不存在或非本人分類均回應 404。
  schema:
    type: string
    format: uuid
PageLimit:
  name: limit
  in: query
  required: false
  description: 每頁預設 50，最高 100。HTTP query 為字串，先完整比對十進位正整數後再解析；空字串、浮點、50abc 拒絕，不使用寬鬆轉型。
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 50
PageCursor:
  name: cursor
  in: query
  required: false
  description: 前次回應的 nextCursor；不透明，綁定帳號、查詢範圍及排序。不可自行推算，也不可沿用另一帳號的 cursor。
  schema:
    type: string
    minLength: 1
