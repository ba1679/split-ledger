TripId:
  name: tripId
  in: path
  required: true
  description: 旅行識別；不存在或非本人旅行均回應 404。
  schema:
    type: string
    format: uuid
ExpenseId:
  name: expenseId
  in: path
  required: true
  description: 支出識別；必須屬於路徑指定的本人旅行。
  schema:
    type: string
    format: uuid
CategoryId:
  name: categoryId
  in: path
  required: true
  description: 個人分類識別；不存在或非本人分類均回應 404。
  schema:
    type: string
    format: uuid
PageLimit:
  name: limit
  in: query
  required: false
  description: 每頁筆數，預設 50，最高 100。
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 50
PageCursor:
  name: cursor
  in: query
  required: false
  description: 前次回應的 nextCursor；不透明字串，不能自行推算。
  schema:
    type: string
    minLength: 1
