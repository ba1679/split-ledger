Expense:
  type: object
  additionalProperties: false
  required: [id, tripId, item, amount, currencyCode, minorUnit, spentOn, category, payerMemberId, shares, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    tripId:
      type: string
      format: uuid
    item:
      type: string
      minLength: 1
      description: 已移除前後空白；不可只含空白。
    amount:
      $ref: ./shared.yaml#/MoneyAmount
    currencyCode:
      $ref: ./shared.yaml#/CurrencyCode
    minorUnit:
      type: integer
      minimum: 0
      maximum: 4
      description: 建立或修改此筆金額時採用的幣別小數位數，歷史資料不隨目錄更新而重算。
    spentOn:
      $ref: ./shared.yaml#/DateOnly
    payerMemberId:
      type: string
      format: uuid
      description: 同旅行的穩定付款人成員 ID；Phase 1A 舊支出回填為 owner 成員。
    shares:
      type: array
      minItems: 1
      description: 依 memberId 升序，所有分攤者精確平均；Phase 1A 舊支出只有 owner。
      items:
        $ref: '#/ExpenseShare'
    category:
      type: object
      nullable: true
      description: 未分類時為 null；分類改名後回傳目前名稱。
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    createdAt:
      $ref: ./shared.yaml#/IsoTimestamp
    updatedAt:
      $ref: ./shared.yaml#/IsoTimestamp
ExpenseShare:
  type: object
  additionalProperties: false
  required: [memberId, amount]
  properties:
    memberId:
      type: string
      format: uuid
    amount:
      $ref: ./shared.yaml#/ExactAmount
CreateExpenseRequest:
  type: object
  additionalProperties: false
  required: [id, item, amount, currencyCode, spentOn]
  properties:
    id:
      type: string
      format: uuid
      description: 客戶端為這次建立產生並保留的 UUID；結果未確認時可透過單筆 GET 查證。
    item:
      type: string
      minLength: 1
      description: 前後空白會移除，空白項目遭拒。
    amount:
      $ref: ./shared.yaml#/MoneyAmount
    currencyCode:
      $ref: ./shared.yaml#/CurrencyCode
    spentOn:
      $ref: ./shared.yaml#/DateOnly
    categoryId:
      type: string
      format: uuid
      nullable: true
      description: 省略或 null 均為未分類；必須屬於目前帳號。
    payerMemberId:
      type: string
      format: uuid
      description: 共同支出須與 shareMemberIds 同時提供；兩者同時省略時相容舊個人支出請求，解讀為 owner 付款、僅 owner 分攤。
    shareMemberIds:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        format: uuid
      description: 至少一位同旅行有效成員；共同支出須與 payerMemberId 同時提供。付款人可以不在其中。
UpdateExpenseRequest:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    item:
      type: string
      minLength: 1
      description: 前後空白會移除，空白項目遭拒。
    amount:
      $ref: ./shared.yaml#/MoneyAmount
    currencyCode:
      $ref: ./shared.yaml#/CurrencyCode
    spentOn:
      $ref: ./shared.yaml#/DateOnly
    categoryId:
      type: string
      format: uuid
      nullable: true
      description: 省略不變；null 清除分類。新分類須屬於目前帳號。
    payerMemberId:
      type: string
      format: uuid
      description: 省略保留原付款人；明確提供時必須是同旅行有效成員。
    shareMemberIds:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        format: uuid
      description: 省略保留原集合；提供時完整取代，成員都必須有效。僅改既有支出的其他欄位可保留已停用成員歷史關聯。
ExpenseList:
  type: object
  additionalProperties: false
  required: [items, nextCursor, totalCount]
  properties:
    items:
      type: array
      items:
        $ref: '#/Expense'
    nextCursor:
      type: string
      nullable: true
      description: null 表示沒有下一頁。
    totalCount:
      type: integer
      minimum: 0
      description: 請求時此本人旅行的全部支出筆數，不是當頁筆數。
CurrencyTotal:
  type: object
  additionalProperties: false
  required: [currencyCode, amount, minorUnit]
  properties:
    currencyCode:
      $ref: ./shared.yaml#/CurrencyCode
    amount:
      type: string
      description: 該原幣別支出的精確總額；可為 0，固定補足其小數位數，不與其他幣別相加。
      example: '17000'
    minorUnit:
      type: integer
      minimum: 0
      maximum: 4
TotalsResponse:
  type: object
  additionalProperties: false
  required: [totals]
  properties:
    totals:
      type: array
      description: 僅列出目前仍有支出的幣別；沒有支出則為空陣列。
      items:
        $ref: '#/CurrencyTotal'
PersonalTotalsResponse:
  type: object
  additionalProperties: false
  required: [totals]
  description: scope=personal 的個人消費份額總額；不受付款人、獨立還款或結清差額影響。
  properties:
    totals:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [currencyCode, amount]
        properties:
          currencyCode:
            $ref: ./shared.yaml#/CurrencyCode
          amount:
            $ref: ./shared.yaml#/ExactAmount
ExpenseCategoryAnalysisResponse:
  type: object
  additionalProperties: false
  required: [tripId, ownerMemberId, hasSharedExpenses, currencies]
  description: 同一唯讀來源快照的當前旅行完整分類分析；不是已分頁支出清單的彙總。
  properties:
    tripId:
      type: string
      format: uuid
      description: 本次統計的旅行 ID，用於識別讀取範圍。
    ownerMemberId:
      type: string
      format: uuid
      description: 目前登入 owner 對應的固定旅行成員 ID；個人圖以此成員的份額計算，不是登入帳號 ID，也不能由請求指定其他成員。
    hasSharedExpenses:
      type: boolean
      description: 整趟旅行任一幣別有至少一筆由兩名以上不同成員分攤的支出時為 true；不由目前所選幣別或 owner 是否參與推斷。
    currencies:
      type: array
      description: 依 currencyCode 升序，每個仍有已保存支出的幣別恰一筆；空旅行為空陣列。即使兩圖皆零也保留該幣別。
      items:
        $ref: '#/ExpenseCategoryCurrency'
ExpenseCategoryCurrency:
  type: object
  additionalProperties: false
  required: [currencyCode, minorUnit, personal, group]
  properties:
    currencyCode:
      $ref: ./shared.yaml#/CurrencyCode
    minorUnit:
      type: integer
      minimum: 0
      maximum: 4
      description: 此旅行此幣別所有已保存支出的最大歷史 minorUnit；兩圖所有 ExactAmount 使用此共同尺度，空圖的 0 亦同。
    personal:
      $ref: '#/ExpenseCategoryChart'
    group:
      $ref: '#/ExpenseCategoryChart'
ExpenseCategoryChart:
  type: object
  additionalProperties: false
  required: [total, categories]
  description: total 等於 categories 所有精確 amount 之和；若 total 為 0/1，categories 必須為空。分類占比是該分類精確 amount / total，零總額時不適用。
  properties:
    total:
      $ref: ./shared.yaml#/ExactAmount
    categories:
      type: array
      description: 只列正金額分類，每個穩定 category ID 至多一筆；未分類獨立一筆。先列未分類，再按 category.id 升序；空圖為空陣列。
      items:
        $ref: '#/ExpenseCategoryAmount'
ExpenseCategoryAmount:
  type: object
  additionalProperties: false
  required: [category, amount]
  description: amount 為此分類精確且大於零的金額，分子／分母為已約分十進位整數字串；minorUnit 等於外層幣別共同尺度，不以顯示取整或還款更動。
  properties:
    category:
      type: object
      nullable: true
      additionalProperties: false
      required: [id, name]
      description: 分類目前名稱及穩定 ID；支出 category_id 為 null 時此值為 null。改名保留 ID，移除支出分類關聯後歸入 null。
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    amount:
      $ref: ./shared.yaml#/ExactAmount
