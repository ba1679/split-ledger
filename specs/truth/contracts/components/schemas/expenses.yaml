Expense:
  type: object
  additionalProperties: false
  required: [id, tripId, item, amount, currencyCode, minorUnit, spentOn, category, payerMemberId, shares, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    tripId:
      type: string
      format: uuid
    item:
      type: string
      minLength: 1
      description: 已移除前後空白；不可只含空白。
    amount:
      $ref: ./shared.yaml#/MoneyAmount
    currencyCode:
      $ref: ./shared.yaml#/CurrencyCode
    minorUnit:
      type: integer
      minimum: 0
      maximum: 4
      description: 建立或修改此筆金額時採用的幣別小數位數，歷史資料不隨目錄更新而重算。
    spentOn:
      $ref: ./shared.yaml#/DateOnly
    payerMemberId:
      type: string
      format: uuid
      description: 同旅行的穩定付款人成員 ID；Phase 1A 舊支出回填為 owner 成員。
    shares:
      type: array
      minItems: 1
      description: 依 memberId 升序，所有分攤者精確平均；Phase 1A 舊支出只有 owner。
      items:
        $ref: '#/ExpenseShare'
    category:
      type: object
      nullable: true
      description: 未分類時為 null；分類改名後回傳目前名稱。
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    createdAt:
      $ref: ./shared.yaml#/IsoTimestamp
    updatedAt:
      $ref: ./shared.yaml#/IsoTimestamp
ExpenseShare:
  type: object
  additionalProperties: false
  required: [memberId, amount]
  properties:
    memberId:
      type: string
      format: uuid
    amount:
      $ref: ./shared.yaml#/ExactAmount
CreateExpenseRequest:
  type: object
  additionalProperties: false
  required: [id, item, amount, currencyCode, spentOn]
  properties:
    id:
      type: string
      format: uuid
      description: 客戶端為這次建立產生並保留的 UUID；結果未確認時可透過單筆 GET 查證。
    item:
      type: string
      minLength: 1
      description: 前後空白會移除，空白項目遭拒。
    amount:
      $ref: ./shared.yaml#/MoneyAmount
    currencyCode:
      $ref: ./shared.yaml#/CurrencyCode
    spentOn:
      $ref: ./shared.yaml#/DateOnly
    categoryId:
      type: string
      format: uuid
      nullable: true
      description: 省略或 null 均為未分類；必須屬於目前帳號。
    payerMemberId:
      type: string
      format: uuid
      description: 共同支出須與 shareMemberIds 同時提供；兩者同時省略時相容舊個人支出請求，解讀為 owner 付款、僅 owner 分攤。
    shareMemberIds:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        format: uuid
      description: 至少一位同旅行有效成員；共同支出須與 payerMemberId 同時提供。付款人可以不在其中。
UpdateExpenseRequest:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    item:
      type: string
      minLength: 1
      description: 前後空白會移除，空白項目遭拒。
    amount:
      $ref: ./shared.yaml#/MoneyAmount
    currencyCode:
      $ref: ./shared.yaml#/CurrencyCode
    spentOn:
      $ref: ./shared.yaml#/DateOnly
    categoryId:
      type: string
      format: uuid
      nullable: true
      description: 省略不變；null 清除分類。新分類須屬於目前帳號。
    payerMemberId:
      type: string
      format: uuid
      description: 省略保留原付款人；明確提供時必須是同旅行有效成員。
    shareMemberIds:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        format: uuid
      description: 省略保留原集合；提供時完整取代，成員都必須有效。僅改既有支出的其他欄位可保留已停用成員歷史關聯。
ExpenseList:
  type: object
  additionalProperties: false
  required: [items, nextCursor, totalCount]
  properties:
    items:
      type: array
      items:
        $ref: '#/Expense'
    nextCursor:
      type: string
      nullable: true
      description: null 表示沒有下一頁。
    totalCount:
      type: integer
      minimum: 0
      description: 請求時此本人旅行的全部支出筆數，不是當頁筆數。
CurrencyTotal:
  type: object
  additionalProperties: false
  required: [currencyCode, amount, minorUnit]
  properties:
    currencyCode:
      $ref: ./shared.yaml#/CurrencyCode
    amount:
      type: string
      description: 該原幣別支出的精確總額；可為 0，固定補足其小數位數，不與其他幣別相加。
      example: '17000'
    minorUnit:
      type: integer
      minimum: 0
      maximum: 4
TotalsResponse:
  type: object
  additionalProperties: false
  required: [totals]
  properties:
    totals:
      type: array
      description: 僅列出目前仍有支出的幣別；沒有支出則為空陣列。
      items:
        $ref: '#/CurrencyTotal'
