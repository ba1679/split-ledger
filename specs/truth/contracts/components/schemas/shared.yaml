ApiError:
  type: object
  additionalProperties: false
  required: [code, message]
  properties:
    code:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - NOT_FOUND
        - CATEGORY_IN_USE
        - CATEGORY_NAME_CONFLICT
        - ID_CONFLICT
        - MEMBER_NAME_CONFLICT
        - MEMBER_IN_USE
        - ACCOUNTING_REVISION_CONFLICT
        - ARRANGEMENT_NOT_FOUND
        - OVERPAYMENT_CONFIRMATION_REQUIRED
        - REQUEST_ORIGIN_REJECTED
        - TRIP_NOT_TRASHED
        - TRIP_TRASHED
        - TRIP_PURGED
        - TRIP_STATE_CHANGED
        - THUMBNAIL_UPDATED
        - OPERATION_ID_CONFLICT
        - OPERATION_NOT_FOUND
        - UPLOAD_INCOMPLETE
        - UPLOAD_TIMEOUT
        - IMAGE_TOO_LARGE
        - UNSUPPORTED_IMAGE_TYPE
        - INVALID_IMAGE
        - UPLOAD_BUSY
        - INTERNAL_ERROR
    message:
      type: string
      description: 可直接顯示的繁體中文訊息，不包含他人的資源或私人資料。
    field:
      type: string
      description: 可選，與表單欄位對應的識別。
    requestId:
      type: string
      description: 可選，供支援與伺服器日誌對照，不包含敏感資訊。
  description: |-
    400：輸入驗證；401：未登入；403：寫入來源被拒；404：不存在或非本人（相同回應）。
    409：分類/成員使用中或重名、建立 UUID 衝突、結算版本過期、付款安排已改變或需超額確認；以 code 區分，不回傳他人資源。
    500 INTERNAL_ERROR：非預期伺服器錯誤，訊息不包含 cookie、token、secret 或完整私人支出。
    網路逾時不是 HTTP 錯誤碼，也不能據此判斷是否已保存。
DateOnly:
  type: string
  format: date
  description: 真實存在的 Gregorian 日曆日期 YYYY-MM-DD，不帶時區。支出預設由裝置本地日期送出，伺服器不推測；不得經 UTC 轉換更改日期。
  example: '2027-03-11'
MoneyAmount:
  type: string
  description: |-
    正數十進位大單位字串，例如 USD "12.50"、JPY "1200"。
    不接受負號、指數、千分位、前後空白、靜默截斷或四捨五入；後端仍獨立驗證。TWD 新送入金額僅接受整數字串，不接受小數點；省略金額的更新不重新驗證既有字串。TWD 儲存位數仍為 ISO 的 2 位，TWD 8000 以 800000 最小單位儲存並回傳 8000.00。
    依適用 minorUnit 轉為最小單位 BigInt，範圍 1–9223372036854775807；不得用 Number/parseFloat 計算。
    回應固定補足本筆保存的位數。未實際換幣別時沿用歷史 minorUnit，實際換幣別才採新目錄位數；沒有換匯。
  pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
  example: '12.50'
ExactAmount:
  type: object
  additionalProperties: false
  required: [numerator, denominator, minorUnit]
  properties:
    numerator:
      type: string
      pattern: '^-?(?:0|[1-9][0-9]*)$'
      description: 有號最小單位分子，十進位整數字串；零一律為 0。
      example: '100'
    denominator:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: 正整數分母十進位字串；分數約分，零一律使用 1。
      example: '3'
    minorUnit:
      type: integer
      minimum: 0
      maximum: 4
      description: 分子的歷史最小單位尺度；真實大單位值為 numerator / denominator / 10^minorUnit。顯示可用小數前綴加精確分數，不得提前取整。
CurrencyCode:
  type: string
  pattern: '^[A-Z]{3}$'
  description: 必須存在於伺服器封存的 SIX ISO 4217 數字 minor unit 清單。
  example: TWD
IsoTimestamp:
  type: string
  format: date-time
  description: 伺服器產生的 UTC 時間戳，用於排序或記錄更新時間。
  example: '2027-03-11T08:30:00Z'
