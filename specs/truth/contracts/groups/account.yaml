me:
  get:
    tags: [account]
    operationId: getMe
    x-session-required: true
    security:
      - BetterAuthSession: []
    summary: 取得目前登入帳號的最小投影
    description: 由 Better Auth 已驗證 session 取得最小身分投影，不接受客戶端指定 userId/owner。Google 登入、取消、callback、續期與登出由 /api/auth/* 及 Better Auth client 處理，不另定一套業務 OAuth JSON 契約。
    responses:
      '200':
        description: 目前登入帳號。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/account.yaml#/Me
      '401':
        description: 未登入、session 失效或登入流程未完成。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
