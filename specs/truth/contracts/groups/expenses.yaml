expenses:
  parameters:
    - $ref: ../components/parameters.yaml#/TripId
  get:
    tags: [expenses]
    operationId: listExpenses
    x-session-required: true
    security:
      - BetterAuthSession: []
    summary: 分頁列出旅行支出
    description: 只列本人旅行的支出，依 spentOn、id 由新到舊排序；分類名稱取目前名稱，不複製舊字串。
    parameters:
      - $ref: ../components/parameters.yaml#/PageLimit
      - $ref: ../components/parameters.yaml#/PageCursor
    responses:
      '200':
        description: 支出清單，沒有資料時 items 為空陣列。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/expenses.yaml#/ExpenseList
      '400':
        description: 分頁參數或 cursor 不合法。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '401':
        description: 尚未登入。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '404':
        description: 旅行不存在或不屬於目前帳號。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '409':
        description: 本人旅行在垃圾桶；code=TRIP_TRASHED。普通子資源不可用 404 偽裝操作成功。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
  post:
    tags: [expenses]
    operationId: createExpense
    x-session-required: true
    security:
      - BetterAuthSession: []
    summary: 記錄個人或共同支出
    description: |
      項目、正數金額、幣別、日期必填；分類選填。支出日期可在旅行日期之外。
      日期預設由裝置填入，API 不推測使用者時區。金額依指定幣別位數精確驗證，
      不接受靜默修正。共同支出須同時提供 payerMemberId 與非空、無重複的 shareMemberIds；
      兩者均省略時沿用 Phase 1A 個人支出請求，解讀為 owner 付款、僅 owner 分攤。
      指定成員必須同旅行且啟用，付款人可不參與分攤。用戶端產生 UUID 並在結果未確認時保留用於查證。
      成功後帳務 revision 遞增，分攤份額與安排從最新來源精確重算。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/expenses.yaml#/CreateExpenseRequest
    responses:
      '201':
        description: 建立成功，回應已保存支出。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/expenses.yaml#/Expense
      '400':
        description: 欄位、日期、金額、幣別、位數、無效/停用成員或 Content-Type 不合法；code=VALIDATION_ERROR。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '401':
        description: 尚未登入。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '404':
        description: 旅行、指定分類或指定成員不存在或不屬於目前帳號/旅行；不揭露他人資源。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '409':
        description: 建立 UUID 已存在，code=ID_CONFLICT；不得把衝突資料回傳給其他帳號；本人垃圾桶旅行回 code=TRIP_TRASHED。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '403':
        description: Origin 缺失、不可信或不符；code=REQUEST_ORIGIN_REJECTED。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
expense:
  parameters:
    - $ref: ../components/parameters.yaml#/TripId
    - $ref: ../components/parameters.yaml#/ExpenseId
  get:
    tags: [expenses]
    operationId: getExpense
    x-session-required: true
    security:
      - BetterAuthSession: []
    summary: 查看單筆支出
    responses:
      '200':
        description: 指定旅行中的本人支出。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/expenses.yaml#/Expense
      '401':
        description: 尚未登入。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '404':
        description: 旅行或支出不存在、不屬於目前帳號，或支出不在指定旅行，均回相同 NOT_FOUND。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '409':
        description: 本人旅行在垃圾桶；code=TRIP_TRASHED。普通子資源不可用 404 偽裝操作成功。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
  patch:
    tags: [expenses]
    operationId: updateExpense
    x-session-required: true
    security:
      - BetterAuthSession: []
    summary: 修改單筆支出
    description: |-
      省略欄位保留原值，categoryId=null 才清除分類。合併後驗證金額與幣別位數，失敗保留原紀錄。
      僅改項目/日期/分類不重解讀金額；幣別未變、只改金額時仍用本筆歷史 minorUnit。
      實際改幣別才採新目錄位數；未傳新金額則沿用原大單位數值，不換算、不四捨五入；不合新位數則拒絕。
      成功後從權威支出資料重算各受影響幣別總額、旅行筆數與分類使用筆數。
      payerMemberId 省略保留原付款人，shareMemberIds 省略保留原集合；明確提供分攤者時完整取代。
      新指定的成員須同旅行且啟用；僅改其他欄位時可保留既有停用成員歷史關聯。
      支出及分攤集合在旅行鎖內原子修改並遞增 revision；原有還款與結清事實不改寫。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/expenses.yaml#/UpdateExpenseRequest
    responses:
      '200':
        description: 修改後支出。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/expenses.yaml#/Expense
      '400':
        description: 欄位、金額、幣別位數、日期或 Content-Type 不合法。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '401':
        description: 尚未登入。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '404':
        description: 旅行、支出、新分類或新指定成員不存在或不屬目前帳號/旅行。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '403':
        description: Origin 缺失、不可信或不符；code=REQUEST_ORIGIN_REJECTED。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '409':
        description: 本人旅行在垃圾桶；code=TRIP_TRASHED。普通子資源不可用 404 偽裝操作成功。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
  delete:
    tags: [expenses]
    operationId: deleteExpense
    x-session-required: true
    security:
      - BetterAuthSession: []
    summary: 刪除單筆支出
    description: 成功後支出及其分攤貢獻不再列出或計入總額、餘額與安排；已發生的還款與結清歷史保留，旅行帳務 revision 遞增。重複刪除回 404。
    responses:
      '204':
        description: 刪除成功，無回應本文。
      '400':
        description: DELETE 帶有本文；code=VALIDATION_ERROR。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '401':
        description: 尚未登入。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '404':
        description: 旅行或支出不存在、不屬於目前帳號，或支出不在此旅行。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '403':
        description: Origin 缺失、不可信或不符；code=REQUEST_ORIGIN_REJECTED。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '409':
        description: 本人旅行在垃圾桶；code=TRIP_TRASHED。普通子資源不可用 404 偽裝操作成功。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
totals:
  parameters:
    - $ref: ../components/parameters.yaml#/TripId
  get:
    tags: [expenses]
    operationId: getTripTotals
    parameters:
      - name: scope
        in: query
        required: false
        schema:
          type: string
          enum: [all, personal]
          default: all
        description: personal 僅加總固定 owner 成員實際參與分攤的精確份額；不含純代付、還款或結清調整。省略維持原旅行全部支出總額。
    x-session-required: true
    security:
      - BetterAuthSession: []
    summary: 查看旅行各原幣別總額
    description: |-
      只加總本人旅行中已保存支出；各幣別分開，不換匯，不用前端已載入的當頁資料代表全帳本。
      按 currency_code,minor_unit 使用 SUM(bigint)，以 NUMERIC 整數字串接收，不轉 JS Number。
      同代碼若有不同歷史位數，用 BigInt 升到該幣別最大 minorUnit 再加總；如 12.3 + 1.23 = 13.53。
      群組總額可超過單筆 BIGINT 範圍。修改/刪除後讀取目前結果；沒有支出的幣別不列出。
      scope=personal 時，在同一唯讀快照內讀取全旅行支出及分攤集合，以 BigInt 有理數逐筆加總 owner 份額，不使用分頁資料或逐筆取整；回傳 ExactAmount。owner 未參與的幣別不列出。
    responses:
      '200':
        description: 依幣別代碼升序的總額陣列；空旅行回空陣列。
        content:
          application/json:
            schema:
              anyOf:
                - $ref: ../components/schemas/expenses.yaml#/TotalsResponse
                - $ref: ../components/schemas/expenses.yaml#/PersonalTotalsResponse
      '401':
        description: 尚未登入。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '404':
        description: 旅行不存在或不屬於目前帳號。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '409':
        description: 本人旅行在垃圾桶；code=TRIP_TRASHED。普通子資源不可用 404 偽裝操作成功。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
expenseAnalysis:
  parameters:
    - $ref: ../components/parameters.yaml#/TripId
  get:
    tags: [expenses]
    operationId: getTripExpenseAnalysis
    x-session-required: true
    security:
      - BetterAuthSession: []
    summary: 查看當前旅行各幣別的個人與團體分類花費
    description: |-
      唯讀、無 query 參數及分頁；只在目前 session 為旅行 owner 且旅行為 active 時讀取。
      於同一 REPEATABLE READ 唯讀快照確認旅行、解析固定 owner 成員，並讀取當前旅行
      全部已保存支出、分攤集合及分類目前名稱，包含旅行日期外、清單未載入頁與停用成員的歷史分攤。
      回應一次列出旅行所有仍有支出的幣別，即使該幣別只有他人單人支出、兩張圖都為零。
      同幣別以所有來源支出保存的最大 minorUnit 為共同尺度，先精確加總再呈現；不跨幣別換算。
      個人圖只加總固定 owner 成員的平均份額，付款人不決定歸屬；團體圖只包含兩人以上
      分攤的支出，各以原始金額計一次，owner 不必參與。團體總額不是旅行全部支出總額。
      分類依穩定 ID 關聯目前名稱；沒有分類的支出歸入 null 分組。還款、結算、淨額及
      實付差額均不影響花費。兩圖由同一來源快照產生；分類占比由精確分類金額除以該圖
      精確總額導出，不在 API 回傳已取整的百分比或任何圖表角度。
      本端點不提供 memberId selector，回應的 ownerMemberId 僅識別本次個人統計對象。
    responses:
      '200':
        description: 單一來源快照的全旅行分類分析；無任何支出時 currencies 為空陣列。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/expenses.yaml#/ExpenseCategoryAnalysisResponse
      '401':
        description: 尚未登入；code=UNAUTHENTICATED。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '404':
        description: 旅行不存在或不屬於目前帳號；code=NOT_FOUND，不揭露他人帳務。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '409':
        description: 本人旅行在垃圾桶；code=TRIP_TRASHED，普通帳務分析不可讀。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
