expenses:
  parameters:
    - $ref: ../components/parameters.yaml#/TripId
  get:
    tags: [expenses]
    operationId: listExpenses
    x-session-required: true
    security:
      - BetterAuthSession: []
    summary: 分頁列出旅行支出
    description: 只列本人旅行的支出，依 spentOn、id 由新到舊排序；分類名稱取目前名稱，不複製舊字串。
    parameters:
      - $ref: ../components/parameters.yaml#/PageLimit
      - $ref: ../components/parameters.yaml#/PageCursor
    responses:
      '200':
        description: 支出清單，沒有資料時 items 為空陣列。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/expenses.yaml#/ExpenseList
      '400':
        description: 分頁參數或 cursor 不合法。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '401':
        description: 尚未登入。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '404':
        description: 旅行不存在或不屬於目前帳號。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
  post:
    tags: [expenses]
    operationId: createExpense
    x-session-required: true
    security:
      - BetterAuthSession: []
    summary: 記錄個人或共同支出
    description: |
      項目、正數金額、幣別、日期必填；分類選填。支出日期可在旅行日期之外。
      日期預設由裝置填入，API 不推測使用者時區。金額依指定幣別位數精確驗證，
      不接受靜默修正。共同支出須同時提供 payerMemberId 與非空、無重複的 shareMemberIds；
      兩者均省略時沿用 Phase 1A 個人支出請求，解讀為 owner 付款、僅 owner 分攤。
      指定成員必須同旅行且啟用，付款人可不參與分攤。用戶端產生 UUID 並在結果未確認時保留用於查證。
      成功後帳務 revision 遞增，分攤份額與安排從最新來源精確重算。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/expenses.yaml#/CreateExpenseRequest
    responses:
      '201':
        description: 建立成功，回應已保存支出。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/expenses.yaml#/Expense
      '400':
        description: 欄位、日期、金額、幣別、位數、無效/停用成員或 Content-Type 不合法；code=VALIDATION_ERROR。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '401':
        description: 尚未登入。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '404':
        description: 旅行、指定分類或指定成員不存在或不屬於目前帳號/旅行；不揭露他人資源。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '409':
        description: 建立 UUID 已存在，code=ID_CONFLICT；不得把衝突資料回傳給其他帳號。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '403':
        description: Origin 缺失、不可信或不符；code=REQUEST_ORIGIN_REJECTED。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
expense:
  parameters:
    - $ref: ../components/parameters.yaml#/TripId
    - $ref: ../components/parameters.yaml#/ExpenseId
  get:
    tags: [expenses]
    operationId: getExpense
    x-session-required: true
    security:
      - BetterAuthSession: []
    summary: 查看單筆支出
    responses:
      '200':
        description: 指定旅行中的本人支出。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/expenses.yaml#/Expense
      '401':
        description: 尚未登入。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '404':
        description: 旅行或支出不存在、不屬於目前帳號，或支出不在指定旅行，均回相同 NOT_FOUND。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
  patch:
    tags: [expenses]
    operationId: updateExpense
    x-session-required: true
    security:
      - BetterAuthSession: []
    summary: 修改單筆支出
    description: |-
      省略欄位保留原值，categoryId=null 才清除分類。合併後驗證金額與幣別位數，失敗保留原紀錄。
      僅改項目/日期/分類不重解讀金額；幣別未變、只改金額時仍用本筆歷史 minorUnit。
      實際改幣別才採新目錄位數；未傳新金額則沿用原大單位數值，不換算、不四捨五入；不合新位數則拒絕。
      成功後從權威支出資料重算各受影響幣別總額、旅行筆數與分類使用筆數。
      payerMemberId 省略保留原付款人，shareMemberIds 省略保留原集合；明確提供分攤者時完整取代。
      新指定的成員須同旅行且啟用；僅改其他欄位時可保留既有停用成員歷史關聯。
      支出及分攤集合在旅行鎖內原子修改並遞增 revision；原有還款與結清事實不改寫。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/expenses.yaml#/UpdateExpenseRequest
    responses:
      '200':
        description: 修改後支出。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/expenses.yaml#/Expense
      '400':
        description: 欄位、金額、幣別位數、日期或 Content-Type 不合法。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '401':
        description: 尚未登入。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '404':
        description: 旅行、支出、新分類或新指定成員不存在或不屬目前帳號/旅行。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '403':
        description: Origin 缺失、不可信或不符；code=REQUEST_ORIGIN_REJECTED。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
  delete:
    tags: [expenses]
    operationId: deleteExpense
    x-session-required: true
    security:
      - BetterAuthSession: []
    summary: 刪除單筆支出
    description: 成功後支出及其分攤貢獻不再列出或計入總額、餘額與安排；已發生的還款與結清歷史保留，旅行帳務 revision 遞增。重複刪除回 404。
    responses:
      '204':
        description: 刪除成功，無回應本文。
      '400':
        description: DELETE 帶有本文；code=VALIDATION_ERROR。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '401':
        description: 尚未登入。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '404':
        description: 旅行或支出不存在、不屬於目前帳號，或支出不在此旅行。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '403':
        description: Origin 缺失、不可信或不符；code=REQUEST_ORIGIN_REJECTED。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
totals:
  parameters:
    - $ref: ../components/parameters.yaml#/TripId
  get:
    tags: [expenses]
    operationId: getTripTotals
    x-session-required: true
    security:
      - BetterAuthSession: []
    summary: 查看旅行各原幣別總額
    description: |-
      只加總本人旅行中已保存支出；各幣別分開，不換匯，不用前端已載入的當頁資料代表全帳本。
      按 currency_code,minor_unit 使用 SUM(bigint)，以 NUMERIC 整數字串接收，不轉 JS Number。
      同代碼若有不同歷史位數，用 BigInt 升到該幣別最大 minorUnit 再加總；如 12.3 + 1.23 = 13.53。
      群組總額可超過單筆 BIGINT 範圍。修改/刪除後讀取目前結果；沒有支出的幣別不列出。
    responses:
      '200':
        description: 依幣別代碼升序的總額陣列；空旅行回空陣列。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/expenses.yaml#/TotalsResponse
      '401':
        description: 尚未登入。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '404':
        description: 旅行不存在或不屬於目前帳號。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
