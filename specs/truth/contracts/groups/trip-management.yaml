trashTrips:
  get:
    tags:
    - trips
    operationId: listTrashTrips
    x-session-required: true
    security:
    - BetterAuthSession: []
    summary: 分頁列出本人垃圾桶旅行
    description: 僅本人 deletedAt 非 null 的旅行；按 deletedAt、id 由新到舊；不載入帳務或圖片 bytes，cursor 綁定 owner 與 trash 範圍。
    parameters:
    - $ref: ../components/parameters.yaml#/PageLimit
    - $ref: ../components/parameters.yaml#/PageCursor
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/trips.yaml#/TrashTripList
      '400':
        description: 分頁參數或 cursor 無效。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '401':
        description: 尚未登入。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
tripState:
  parameters:
  - $ref: ../components/parameters.yaml#/TripId
  get:
    tags:
    - trips
    operationId: getTripState
    x-session-required: true
    security:
    - BetterAuthSession: []
    summary: 查證本人旅行目前狀態
    description: 專用 owner scope；active/trash 讀 trips，purged 只讀本人 reservation tombstone。purged 不回名稱、帳務或圖片內容；未知或他人統一
      404。此狀態不證明特定命令成功，需查 operation 收據。
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/trips.yaml#/TripState
      '401':
        description: 尚未登入。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '404':
        description: 旅行不存在或非本人，統一 code=NOT_FOUND；不得洩漏其他 owner 的狀態。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
trashTrip:
  parameters:
  - $ref: ../components/parameters.yaml#/TripId
  post:
    tags:
    - trips
    operationId: moveTripToTrash
    x-session-required: true
    security:
    - BetterAuthSession: []
    summary: 移入旅行垃圾桶
    description: 僅 active 可移入；成功後仍保留完整帳務、分類引用與縮圖。 請求只接受 application/json；operationId 為本 owner 全域唯一 UUID。指紋包含 kind、tripId、完整命令欄位；同
      ID 同指紋的持久收據必先於版本與狀態檢查重播，無新寫入。新命令在旅行列鎖下比對 expectedLifecycleRevision，提交時與收據同交易；回應遺失先 GET operations 查證。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/trips.yaml#/TripLifecycleCommand
    responses:
      '200':
        description: 成功。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/trips.yaml#/TripOperationOutcome
      '400':
        description: 無效 UUID、版本或 JSON 格式；code=VALIDATION_ERROR。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '401':
        description: 尚未登入。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '403':
        description: Origin 不符；code=REQUEST_ORIGIN_REJECTED。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '404':
        description: 旅行不存在或非本人，統一 code=NOT_FOUND；不得洩漏其他 owner 的狀態。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
      '409':
        description: 同 operationId 不同指紋 code=OPERATION_ID_CONFLICT；預期版本不符 code=TRIP_STATE_CHANGED；狀態不符 code=TRIP_NOT_TRASHED、TRIP_TRASHED 或 TRIP_PURGED。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/shared.yaml#/ApiError
