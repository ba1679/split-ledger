<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的旅行・旅帳</title>
  <style>
    :root{--bg:#f6f6f0;--panel:#fff;--ink:#192e29;--muted:#5b6b64;--green:#245c49;--soft:#e9f0e8;--line:#dce3dc;--danger:#a83232;--serif:Georgia,'Noto Serif TC',serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #b77421;outline-offset:3px}h1,h2,p{margin:0}h1{font-size:36px;line-height:1.3;letter-spacing:-1px}h2{font-size:22px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--muted);margin-bottom:12px}.sidebar{position:fixed;inset:0 auto 0 0;width:228px;padding:36px 28px;background:#eef0e8;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:1px;min-height:44px}.brand-mark{width:36px;height:36px;border:1px solid currentColor;border-radius:50%;display:grid;place-items:center;font:21px var(--serif)}nav{display:grid;gap:8px;margin-top:65px}nav a{display:flex;align-items:center;gap:12px;padding:13px;border-radius:8px;font-size:15px;color:var(--muted)}nav a.active{background:#dfe9dd;color:var(--ink);font-weight:650}.sidebar footer{margin-top:auto;font-size:13px}.main{max-width:1300px;margin-left:228px;padding:48px 56px 80px}.page-head{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:36px}.page-head p{margin-top:10px}.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;background:var(--green);color:#fff;border:1px solid var(--green);border-radius:7px;padding:11px 21px;min-height:46px;font-weight:600;font-size:14px;white-space:nowrap}.btn:hover{background:#174733}.btn.secondary{background:transparent;border-color:var(--line);color:var(--ink)}.btn.secondary:hover{background:var(--soft)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.trip-card{display:block;border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden}.trip-card:hover{transform:translateY(-3px);box-shadow:0 10px 30px #192e290a}.landscape{height:170px;position:relative;overflow:hidden;background:#e4e9e0;display:grid;place-items:center}.landscape span{font:54px var(--serif);letter-spacing:8px;color:#536f5b;z-index:1}.landscape:before,.landscape:after{content:'';border:1px solid #97ad90;border-radius:50%;position:absolute}.landscape:before{width:260px;height:260px;right:-20px;top:45px}.landscape:after{width:180px;height:180px;left:-30px;top:95px}.card-content{padding:22px}.card-top,.card-bottom{display:flex;justify-content:space-between;gap:12px;align-items:center}.card-date{margin:12px 0 22px;color:var(--muted)}.card-bottom{border-top:1px solid var(--line);padding-top:15px;font-size:13px;color:var(--muted)}.note{display:flex;align-items:center;gap:8px;margin-top:28px;color:var(--muted);font-size:14px}.icon{width:19px;height:19px;flex:none}.state,.empty{padding:45px;border:1px solid var(--line);border-radius:10px;text-align:center;background:var(--panel)}.state p,.empty p{margin:12px 0 22px;color:var(--muted)}.feedback{margin-bottom:18px;padding:12px 15px;background:var(--soft);border:1px solid var(--line);border-radius:7px}.error{color:var(--danger)}.error:empty{display:none}.bottom-nav{display:none}dialog{border:1px solid var(--line);border-radius:12px;padding:30px;width:min(480px,calc(100% - 32px));max-height:calc(100dvh - 32px);overflow:auto;color:var(--ink);background:var(--panel);box-shadow:0 20px 100px #192e2925}dialog::backdrop{background:#12251d66}dialog h2{margin-bottom:24px}.field{margin-bottom:24px}.field label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}.optional{font-size:12px;color:var(--muted);font-weight:400;margin-left:7px}input{width:100%;border:1px solid #bccac0;border-radius:6px;padding:12px 14px;min-height:48px;background:var(--panel);color:var(--ink);min-width:0}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}.form-actions{display:flex;justify-content:flex-end;gap:12px;border-top:1px solid var(--line);padding-top:18px;margin-top:16px}.form-error{min-height:22px;margin-bottom:12px}.dev-switch{position:fixed;right:16px;bottom:16px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 10px;color:var(--muted);font-size:12px}.dev-switch select{border:0;background:transparent;color:inherit}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:700px){h1{font-size:28px}.sidebar{display:none}.main{margin:0;padding:25px 20px 110px}.page-head{align-items:flex-start;gap:12px;margin-bottom:25px}.page-head>.btn{padding:10px 13px}.grid{grid-template-columns:1fr;gap:20px}.landscape{height:145px}.bottom-nav{display:flex;position:fixed;inset:auto 0 0;background:#ffffffed;border-top:1px solid var(--line);justify-content:space-around;padding:8px 12px max(8px,env(safe-area-inset-bottom));z-index:10}.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);min-width:100px}.bottom-nav a.active{color:var(--green);font-weight:700}.two-col{grid-template-columns:1fr;gap:0}dialog{padding:24px 18px}.form-actions{flex-wrap:wrap}}
  </style>
</head>
<body>
  <aside class="sidebar"><a href="index.html" class="brand"><span class="brand-mark" aria-hidden="true">t.</span>旅帳</a><nav aria-label="主要導覽"><a href="index.html" class="active">▣ <span>我的旅行</span></a><a href="#" onclick="return false">☷ <span>支出分類</span></a></nav><footer><div class="eyebrow">A LITTLE RECORD<br>OF EVERY JOURNEY.</div><p>示範使用者</p><button type="button" class="btn secondary">登出</button></footer></aside>
  <main class="main"><header class="page-head"><div><div class="eyebrow">MY JOURNEYS</div><h1>每一趟，都有故事。</h1><p class="muted">把沿途的小花費，留在各自的旅行裡。</p></div><button id="open-form" class="btn" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14M5 12h14"/></svg><span>新增旅行</span></button></header><div id="feedback" class="feedback" role="status" tabindex="-1" hidden></div><div id="content" aria-live="polite"></div><p class="note">▤ <span>不同幣別各自統計，保留每筆支出原本的樣子。</span></p></main>
  <nav class="bottom-nav" aria-label="行動導覽"><a href="index.html" class="active">▣<span>我的旅行</span></a><a href="#" onclick="return false">☷<span>支出分類</span></a></nav>
  <dialog id="form-dialog" aria-labelledby="dialog-title"><h2 id="dialog-title">新增旅行</h2><form id="trip-form" novalidate><div class="field"><label for="name">旅行名稱</label><input id="name" name="name" placeholder="例如：日本春日旅行" required></div><div class="two-col"><div class="field"><label for="start">開始日<span class="optional">選填</span></label><input id="start" name="start" placeholder="2027/03/10" inputmode="numeric"></div><div class="field"><label for="end">結束日<span class="optional">選填</span></label><input id="end" name="end" placeholder="2027/03/15" inputmode="numeric"></div></div><p id="form-error" class="error form-error" role="alert"></p><div class="form-actions"><button id="cancel" class="btn secondary" type="button">取消</button><button id="submit" class="btn" type="submit">建立旅行</button></div></form></dialog>

  <script>
    const dialog=document.getElementById('form-dialog'),form=document.getElementById('trip-form'),content=document.getElementById('content'),feedback=document.getElementById('feedback'),state={value:new URLSearchParams(location.search).get('state')||'ready'};
    const trips=[{name:'日本春日旅行',date:'2027/03/10 — 2027/03/15',count:0}];let opener;
    function render(){const value=state.value;if(value==='loading'){content.innerHTML='<section class="state" role="status"><h2>正在載入旅行…</h2><p>請稍候。</p></section>';return}if(value==='error'){content.innerHTML='<section class="state"><h2>旅行暫時無法載入</h2><p role="alert">請確認連線後再試一次。</p><button class="btn" id="retry">重試</button></section>';document.getElementById('retry').onclick=()=>{state.value='ready';render()};return}if(value==='empty'||!trips.length){content.innerHTML='<section class="empty"><h2>旅程，從第一本帳本開始。</h2><p>建立一趟旅行，記下你的第一筆支出。</p></section>';return}content.innerHTML='<div class="grid">'+trips.map(t=>'<article class="trip-card"><div class="landscape" aria-hidden="true"><span>JOURNEY</span></div><div class="card-content"><div class="card-top"><h2>'+escapeHtml(t.name)+'</h2><span aria-hidden="true">›</span></div><p class="card-date">'+escapeHtml(t.date)+'</p><div class="card-bottom"><span>'+t.count+' 筆支出</span><span>開啟旅行帳本</span></div></div></article>').join('')+'</div>'}
    function escapeHtml(value){return value.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function close(){dialog.close();opener?.focus()}
    document.getElementById('open-form').onclick=e=>{opener=e.currentTarget;form.reset();document.getElementById('form-error').textContent='';dialog.showModal();document.getElementById('name').focus()};document.getElementById('cancel').onclick=close;dialog.addEventListener('close',()=>opener?.focus());
    form.onsubmit=e=>{e.preventDefault();const name=form.elements.namedItem('name').value.trim(),start=form.elements.namedItem('start').value.trim(),end=form.elements.namedItem('end').value.trim(),error=document.getElementById('form-error');error.textContent='';if(!name){error.textContent='請填寫旅行名稱。';form.elements.namedItem('name').focus();return}const datePattern=/^\d{4}\/\d{2}\/\d{2}$/;if((start&&!datePattern.test(start))||(end&&!datePattern.test(end))){error.textContent='請輸入有效日期，例如 2027/03/11。';return}if(start&&end&&end<start){error.textContent='結束日不能早於開始日。';return}const submit=document.getElementById('submit');submit.disabled=true;submit.textContent='儲存中…';setTimeout(()=>{trips.unshift({name,date:start&&end?start+' — '+end:start?start+' — 結束日未定':end?'開始日未定 — '+end:'旅行日期未定',count:0});submit.disabled=false;submit.textContent='建立旅行';state.value='ready';render();close();feedback.hidden=false;feedback.textContent='旅行已建立。';feedback.focus()},350)};
    render();
  </script>
</body>
</html>
